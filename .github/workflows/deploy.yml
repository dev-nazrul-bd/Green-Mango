# GitHub Actions workflow to auto-deploy the Green Mango application.
# Configured specifically to deploy to greenmango.web.app (Site ID: greenmango).

name: Deploy to Firebase Hosting (greenmango)

on:
  push:
    branches:
      - main
      - master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build React Application
        run: npm run build

      - name: Deploy to Firebase Hosting via Service Account
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.TOKEN || secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: greenmango

      - name: Deploy to Firebase Hosting via CLI Token
        if: ${{ secrets.TOKEN != '' && secrets.FIREBASE_SERVICE_ACCOUNT == '' }}
        run: npx firebase-tools deploy --only hosting --project greenmango
        env:
          FIREBASE_TOKEN: ${{ secrets.TOKEN }}
