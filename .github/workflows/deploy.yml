name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main # আপনার মেইন ব্রাঞ্চের নাম যদি 'master' হয়, তবে এখানে master লিখে দিন

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ১. গিটহাব থেকে কোড চেকআউট করা
      - name: Checkout code
        uses: actions/checkout@v4

      # ২. নোড জেএস সেটআপ করা
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # ৩. ডিপেন্ডেন্সি ইনস্টল করা
      - name: Install dependencies
        run: npm ci # আপনার প্রোজেক্টে yarn থাকলে 'yarn install' লিখবেন

      # ৪. প্রোজেক্ট বিল্ড করা
      - name: Build project
        run: npm run build

      # ৫. ফায়ারবেস টুলস ইনস্টল ও নির্দিষ্ট সাইট ডেপ্লয় করা
      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting:greenmango --token "$FIREBASE_TOKEN"
